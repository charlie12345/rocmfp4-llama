name: Windows CI (ROCmFP4)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
      - mtp-rocmfp4-strix
      - mtp-copilot-pr1
    paths:
      - '.github/workflows/build-windows.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - mtp-rocmfp4-strix
    paths:
      - '.github/workflows/build-windows.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_LOG_COLORS: 1
  LLAMA_LOG_PREFIX: 1
  LLAMA_LOG_TIMESTAMPS: 1
  OPENBLAS_VERSION: 0.3.23
  VULKAN_VERSION: 1.4.313.2

jobs:
  windows-x64-cpu:
    runs-on: windows-2025
    name: Windows x64 CPU (Static)

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x64-cpu
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build (x64 CPU, Static)
        id: cmake_build
        run: |
          cmake -B build `
            -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_WEBUI=OFF `
            -DLLAMA_USE_PREBUILT_WEBUI=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DGGML_RPC=ON `
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release

      - name: Test
        id: cmake_test
        run: |
          cd build
          ctest -L main -C Release -E "test-llama-archs|test-chat" --verbose --timeout 900

      - name: Create artifact archive
        run: |
          cd build
          mkdir -p artifacts
          copy bin\Release\*.exe artifacts\ 2>nul || true
          copy bin\Release\*.dll artifacts\ 2>nul || true
          7z a llama-windows-cpu.7z artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llama-windows-x64-cpu
          path: build/llama-windows-cpu.7z
          retention-days: 7

  windows-x64-openblas:
    runs-on: windows-2025
    name: Windows x64 OpenBLAS

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x64-openblas
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Download OpenBLAS
        id: get_openblas
        run: |
          curl.exe -o $env:RUNNER_TEMP/openblas.zip -L "https://github.com/xianyi/OpenBLAS/releases/download/v${env:OPENBLAS_VERSION}/OpenBLAS-${env:OPENBLAS_VERSION}-x64.zip"
          curl.exe -o $env:RUNNER_TEMP/OpenBLAS.LICENSE.txt -L "https://github.com/xianyi/OpenBLAS/raw/v${env:OPENBLAS_VERSION}/LICENSE"
          mkdir $env:RUNNER_TEMP/openblas
          tar.exe -xvf $env:RUNNER_TEMP/openblas.zip -C $env:RUNNER_TEMP/openblas
          $vcdir = $(vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          $msvc = $(join-path $vcdir $('VC\Tools\MSVC\'+$(gc -raw $(join-path $vcdir 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()))
          $lib =  $(join-path $msvc 'bin\Hostx64\x64\lib.exe')
          & $lib /machine:x64 "/def:${env:RUNNER_TEMP}/openblas/lib/libopenblas.def" "/out:${env:RUNNER_TEMP}/openblas/lib/openblas.lib" /name:openblas.dll

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build (x64 OpenBLAS)
        id: cmake_build
        run: |
          cmake -B build `
            -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_WEBUI=OFF `
            -DLLAMA_USE_PREBUILT_WEBUI=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_OPENMP=OFF `
            -DGGML_BLAS=ON `
            -DGGML_BLAS_VENDOR=OpenBLAS `
            -DBLAS_INCLUDE_DIRS="$env:RUNNER_TEMP/openblas/include" `
            -DBLAS_LIBRARIES="$env:RUNNER_TEMP/openblas/lib/openblas.lib"
          cmake --build build --config Release

      - name: Add libopenblas.dll
        id: add_libopenblas_dll
        run: |
          cp $env:RUNNER_TEMP/openblas/bin/libopenblas.dll ./build/bin/Release/openblas.dll
          cp $env:RUNNER_TEMP/OpenBLAS.LICENSE.txt ./build/bin/Release/OpenBLAS-${env:OPENBLAS_VERSION}.txt

      - name: Test
        id: cmake_test
        run: |
          cd build
          ctest -L main -C Release --verbose --timeout 900

      - name: Create artifact archive
        run: |
          cd build
          mkdir -p artifacts
          copy bin\Release\*.exe artifacts\ 2>nul || true
          copy bin\Release\*.dll artifacts\ 2>nul || true
          copy "bin\Release\openblas.dll" artifacts\ 2>nul || true
          7z a llama-windows-openblas.7z artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llama-windows-x64-openblas
          path: build/llama-windows-openblas.7z
          retention-days: 7

  windows-x64-vulkan:
    runs-on: windows-2025
    name: Windows x64 Vulkan

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-x64-vulkan
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Install Vulkan SDK
        id: get_vulkan
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Build (x64 Vulkan)
        id: cmake_build
        run: |
          cmake -B build `
