          retention-days: 7

  windows-latest-hip:
    runs-on: windows-2022
    name: Windows ROCm (HIP)
    continue-on-error: true

    env:
      HIPSDK_INSTALLER_VERSION: "26.Q1"

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-latest-hip
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Use ROCm Installation Cache
        uses: actions/cache@v5
        id: cache-rocm
        with:
          path: C:\Program Files\AMD\ROCm
          key: rocm-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Setup ROCm
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.HIPSDK_INSTALLER_VERSION }}

      - name: Verify ROCm
        id: verify
        run: |
          # Find and test ROCm installation
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) {
            Write-Error "ROCm installation not found"
            exit 1
          }
          & $clangPath.FullName --version

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build (HIP)
        id: cmake_build
        run: |
          $rocmPath = Get-ChildItem 'C:\Program Files\AMD\ROCm' | Select-Object -First 1 | ForEach-Object { $_.FullName }
          $env:PATH = "$rocmPath\bin;$env:PATH"
          
          cmake -B build `
            -G "Ninja Multi-Config" `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DGGML_HIP=ON `
            -DGPU_TARGETS="gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1102;gfx1151" `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_WEBUI=OFF `
            -DLLAMA_USE_PREBUILT_WEBUI=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON
          cmake --build build --config Release

      - name: Create artifact archive
        run: |
          cd build
          mkdir -p artifacts
          copy bin\Release\*.exe artifacts\ 2>nul || true
          copy bin\Release\*.dll artifacts\ 2>nul || true
          7z a llama-windows-hip.7z artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llama-windows-hip
          path: build/llama-windows-hip.7z
          retention-days: 7

