            -DLLAMA_OPENSSL=OFF `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON
          cmake --build build --config Release

      - name: Test
        id: cmake_test
